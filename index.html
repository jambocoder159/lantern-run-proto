<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>柑仔天燈小鎮（測試版）— 請輸入密碼</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a1630; color: #f5eee6; font-family: system-ui, -apple-system, "Noto Sans TC", "PingFang TC", sans-serif; padding: 16px; }
  main { width: 100%; max-width: 420px; background: #2a2440; border-radius: 16px; padding: 28px 24px; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  p { margin: 0 0 20px; line-height: 1.6; color: #e6dccf; }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  input { width: 100%; font-size: 1rem; padding: 12px; border-radius: 10px; border: 2px solid #b8a9d9; background: #15122a; color: #fff; min-height: 48px; }
  input:focus-visible, button:focus-visible { outline: 3px solid #ffd27a; outline-offset: 2px; }
  button { margin-top: 16px; width: 100%; min-height: 48px; font-size: 1.05rem; font-weight: 700; border: 0; border-radius: 10px; background: #ffc061; color: #2a1a00; cursor: pointer; }
  button[disabled] { opacity: .7; cursor: progress; }
  #err { color: #ffb4a8; margin-top: 12px; min-height: 1.5em; }
  #status { margin-top: 12px; color: #e6dccf; min-height: 1.5em; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main>
  <h1>柑仔天燈小鎮（測試版）</h1>
  <p>這是尚未公開的測試版本，請輸入密碼才能進入遊戲。</p>
  <form id="f" novalidate>
    <label for="pw">密碼</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required aria-describedby="err">
    <button id="go" type="submit">進入遊戲</button>
    <div id="err" role="alert" aria-live="assertive"></div>
    <div id="status" role="status" aria-live="polite"></div>
  </form>
</main>
<script>
(() => {
  const CACHE = 'lantern-run-app-v1'
  const f = document.getElementById('f'), pw = document.getElementById('pw'), go = document.getElementById('go')
  const err = document.getElementById('err'), status = document.getElementById('status')
  const fail = (m) => { err.textContent = m; status.textContent = ''; go.disabled = false; pw.focus() }
  if (!('serviceWorker' in navigator) || !window.crypto?.subtle || !('DecompressionStream' in window)) {
    fail('這個瀏覽器不支援必要功能，請改用最新版 Chrome、Safari 或 Edge。'); go.disabled = true; return
  }
  f.addEventListener('submit', async (ev) => {
    ev.preventDefault(); err.textContent = ''
    if (!pw.value) return fail('請輸入密碼。')
    go.disabled = true; status.textContent = '下載中（約 10 MB）…'
    try {
      const buf = new Uint8Array(await (await fetch('./bundle.enc', { cache: 'no-store' })).arrayBuffer())
      if (new TextDecoder().decode(buf.slice(0, 4)) !== 'LRP1') throw new Error('bad bundle')
      const iter = new DataView(buf.buffer).getUint32(4, true)
      const salt = buf.slice(8, 24), iv = buf.slice(24, 36), ct = buf.slice(36)
      status.textContent = '驗證密碼中…'
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.value), 'PBKDF2', false, ['deriveKey'])
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt'])
      let gz
      try { gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct) } catch { return fail('密碼不正確，請再試一次。') }
      status.textContent = '解壓縮中…'
      const raw = new Uint8Array(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())
      const hl = new DataView(raw.buffer).getUint32(0, true)
      const index = JSON.parse(new TextDecoder().decode(raw.slice(4, 4 + hl)))
      const body = 4 + hl
      status.textContent = '準備遊戲中…'
      const reg = await navigator.serviceWorker.register('./sw.js', { scope: './app/' })
      await caches.delete(CACHE)
      const cache = await caches.open(CACHE)
      const appBase = new URL('./app/', location.href)
      for (const e of index) {
        const bytes = raw.slice(body + e.off, body + e.off + e.len)
        await cache.put(new URL(e.path, appBase).href, new Response(bytes, { headers: { 'Content-Type': e.mime } }))
      }
      const sw = reg.installing || reg.waiting || reg.active
      if (sw && sw.state !== 'activated') await new Promise((r) => sw.addEventListener('statechange', () => sw.state === 'activated' && r()))
      status.textContent = '進入遊戲…'
      location.href = appBase.href
    } catch (e) { console.warn(e); fail('載入失敗，請重新整理後再試一次。') }
  })
})()
</script>
</body>
</html>
